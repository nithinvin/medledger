      CORE_PEER_CHAINCODEADDRESS: peer0.hospitala.example.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.hospitala.example.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.hospitala.example.com:7051
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb-a:5984
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/hospitala.example.com/peers/peer0.hospitala.example.com/msp:/etc/hyperledger/fabric/msp:ro
      - ./organizations/peerOrganizations/hospitala.example.com/peers/peer0.hospitala.example.com/tls:/etc/hyperledger/fabric/tls:ro
